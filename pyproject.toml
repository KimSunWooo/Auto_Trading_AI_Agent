[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-agent"
version = "0.1.0"
description = "Standalone AI investment judgment agent. Emits TradeProposal only; never places orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
ai-investment-agent = "ai_investment_agent.api.app:run"
ai-observation-smoke = "ai_investment_agent.cli.observation_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_investment_agent = [
    "adapters/fixtures/data/*.json",
    "collectors/data/*.json",
    "contracts/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "FURB157",
    "FURB167",
    "FURB162",
    "FURB136",
    "UP017",
    "UP035",
    "I001",
    "PLR1730",
    "SIM102",
    "SIM103",
    "RUF007",
    "RUF022",
    "FLY002",
    "BLE001",
    "E501",
]
